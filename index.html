<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0f3d2d" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>qbcalc</title>
		<meta
			name="description"
			content="A client-side blackjack calculator: count-aware expected value, dealt practice hands, and session simulations."
		/>

		<!-- Open Graph. Absolute URLs throughout: a scraper has no page base to
		     resolve a relative one against, and a `<meta>`'s `content` is not
		     something Vite's `base` rewrite touches. `%SITE_URL%` is filled in
		     by the `qbcalc:site-url` plugin, from the same constants `base`
		     itself is built out of. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="qbcalc" />
		<meta property="og:title" content="qbcalc — Blackjack EV Calculator" />
		<meta
			property="og:description"
			content="A client-side blackjack calculator: count-aware expected value, dealt practice hands, and session simulations."
		/>
		<meta property="og:url" content="%SITE_URL%" />
		<meta property="og:image" content="%SITE_URL%og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The qbcalc header over green baize, beside a patch of its strategy grid, with counters standing on the plays the count has moved."
		/>
		<meta name="twitter:card" content="summary_large_image" />
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>

		<script src="/src/index.tsx" type="module"></script>
	</body>
</html>
